name: PHP checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Draft implementation ref. Adopt a reviewed release before production use.
      - uses: vhco-pro/php-ci-action@2c058210653ff167e37858696ebfd947c43f004b
        with:
          php-version: '8.5.12'
          semgrep-config: security.yml
